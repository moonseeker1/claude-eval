[project]
name = "claude-eval"
version = "0.1.0"
description = "Evaluation framework for Claude Code tool usage via transcript analysis"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
claude-eval = "claude_eval.main:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
